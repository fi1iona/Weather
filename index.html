<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабораторна №5–6 · Списки та погода</title>
<script defer src="script.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#fbd3e6,transparent 55%),#fff2f7;color:#422237;font:16px/1.55 system-ui,sans-serif}main{width:min(100% - 32px,760px);margin:52px auto}header{margin-bottom:28px}h1,h2,p{margin:0}h1{font:normal clamp(38px,7vw,62px)/1.04 Georgia,serif;margin:8px 0 13px}header p,.hint{color:#775266}small.tag{font-weight:750;color:#9c2f64;letter-spacing:.13em;text-transform:uppercase}section{background:#fffcfe;border:1px solid #efd0df;border-radius:23px;padding:clamp(17px,4vw,30px);margin:18px 0;box-shadow:0 12px 35px #87315e12}h2{font:normal 29px Georgia,serif;margin:5px 0 13px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}nav a,button{display:inline-block;padding:10px 17px;border-radius:999px;font:inherit;font-weight:650}nav a{background:#fae1ee;color:#832750;text-decoration:none}nav a:hover,nav a[aria-current]{background:#a33569;color:white}#list-result{background:#fff2af;border:1px solid #ead47a;color:#56410b;padding:13px 17px;border-radius:12px}#list-result ul{margin:6px 0 0;padding-left:20px}form{display:grid;gap:8px;margin-top:16px}label{font-weight:650}input:not([type=file]){width:100%;padding:10px 12px;border:1px solid #e0b6ca;border-radius:10px;color:inherit;background:#fff8fc;font:inherit}button{justify-self:start;border:0;background:#a33569;color:white;cursor:pointer;margin-top:6px}button:hover{background:#852651}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #a33569;outline-offset:3px}.hint{font-size:14px}#weather-result:not(:empty){margin-top:16px;padding:13px 17px;background:#fbedf5;border-radius:12px}
</style>
</head>
<body><main>
<header><small class="tag">Лабораторна робота №5–6</small><h1>Списки та погода</h1><p>Завантаження JSON і робота з API у JavaScript.</p></header>
<section><small class="tag">Завдання 01</small><h2>Завантаження списків із JSON</h2>
<nav aria-label="Списки"><a href="1.txt" data-title="Мови програмування">мови</a><a href="2.txt" data-title="Прізвища студентів">студенти</a></nav>
<input type="file" id="local-file" accept=".txt,.json" hidden>
<div id="list-result" role="status">Оберіть список.</div>
</section>
<section><small class="tag">Завдання 02</small><h2>Поточна погода</h2>
<p class="hint">Введіть назву міста, щоб дізнатися поточну погоду.</p>
<form id="weather-form">
<label for="city">Місто</label><input id="city" value="London" required>
<button type="submit">Показати погоду</button>
</form><div id="weather-result" role="status"></div>
</section></main></body></html>
